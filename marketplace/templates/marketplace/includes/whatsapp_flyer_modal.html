<!-- Standalone 1-Click WhatsApp Status Flyer Generator Modal (Large Showcase + iPhone/Android Ready) -->
<div id="nsFlyerModal" class="hidden fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-purple-100 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </span>
        <div>
          <h3 class="text-sm font-black text-slate-900">WhatsApp Status Flyer</h3>
          <p class="text-[11px] text-slate-500">Large item showcase • Ready for WhatsApp Status</p>
        </div>
      </div>
      <button type="button" onclick="closeFlyerModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center cursor-pointer">✕</button>
    </div>

    <!-- Live Flyer Preview -->
    <div class="bg-slate-100 rounded-2xl p-2 flex items-center justify-center border border-slate-200 min-h-[240px]">
      <img id="nsFlyerPreviewImg" src="" alt="Promo Flyer Preview" class="w-full max-h-[350px] object-contain rounded-xl shadow-sm">
    </div>

    <!-- Photo Framing Toggle (Bold Large vs Fit Full Photo) -->
    <div class="flex items-center justify-between bg-purple-50/80 border border-purple-100 rounded-2xl px-3 py-2">
      <span class="text-[11px] font-bold text-purple-950">Photo Framing:</span>
      <button
        type="button"
        id="nsFramingToggleBtn"
        onclick="toggleFlyerFramingMode()"
        class="text-[11px] font-extrabold px-3 py-1 rounded-full bg-white hover:bg-purple-100 text-purple-700 border border-purple-200 shadow-2xs transition-colors cursor-pointer"
      >
        Mode: Bold Large (Recommended)
      </button>
    </div>

    <p class="text-[10.5px] text-center text-slate-500 font-medium">
      Tip on iPhone: Tap <strong>Save / Share Flyer</strong> (or press &amp; hold the flyer above → <strong>Save to Photos</strong>).
    </p>

    <canvas id="nsFlyerCanvas" width="1080" height="1350" class="hidden"></canvas>

    <div class="grid grid-cols-2 gap-2.5">
      <button type="button" id="nsDownloadFlyerBtn" onclick="saveOrShareFlyerImage()" class="py-3 px-4 rounded-full bg-purple-700 hover:bg-purple-800 text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>Save / Share Flyer</span>
      </button>

      <a id="nsShareWaBtn" target="_blank" href="#" class="py-3 px-4 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm">
        <i data-lucide="message-circle" class="w-4 h-4"></i>
        <span>Share Link</span>
      </a>
    </div>
  </div>
</div>

<script>
  let currentFlyerBlob = null;
  let currentFlyerFilename = 'naijasale-promo.png';
  let currentFlyerTitle = 'NaijaSale Listing';
  let currentFlyerData = null;
  let currentLoadedImg = null;
  let currentLoadedLogo = null;
  // 'smart' fills the expanded green-marked zone boldly; 'full' fits whole photo without cropping
  let flyerFramingMode = 'smart';

  function closeFlyerModal() {
    document.getElementById('nsFlyerModal').classList.add('hidden');
  }

  function updateFramingButtonLabel() {
    const btn = document.getElementById('nsFramingToggleBtn');
    if (!btn) return;
    if (flyerFramingMode === 'smart') {
      btn.textContent = 'Mode: Bold Large (Recommended)';
    } else {
      btn.textContent = 'Mode: Fit Whole Photo';
    }
  }

  function toggleFlyerFramingMode() {
    flyerFramingMode = (flyerFramingMode === 'smart') ? 'full' : 'smart';
    updateFramingButtonLabel();
    if (currentFlyerData) {
      paintFlyerCanvas(currentFlyerData, currentLoadedImg, currentLoadedLogo);
    }
  }

  async function saveOrShareFlyerImage() {
    if (!currentFlyerBlob) return;

    try {
      const file = new File([currentFlyerBlob], currentFlyerFilename, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: currentFlyerTitle,
          text: 'Check out my listing on NaijaSale.com!'
        });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }

    const blobUrl = URL.createObjectURL(currentFlyerBlob);
    const link = document.createElement('a');
    link.href = blobUrl;
    link.download = currentFlyerFilename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
  }

  function wrapLines(ctx, text, maxWidth, maxLines) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return [''];
    const lines = [];
    let current = words[0];

    for (let i = 1; i < words.length; i++) {
      const test = current + ' ' + words[i];
      if (ctx.measureText(test).width <= maxWidth) {
        current = test;
      } else {
        lines.push(current);
        current = words[i];
        if (lines.length >= maxLines - 1) break;
      }
    }
    lines.push(current);
    return lines.slice(0, maxLines);
  }

  function drawRoundedRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function drawFallbackBagIcon(ctx, x, y, size) {
    ctx.save();
    drawRoundedRect(ctx, x, y + size * 0.22, size, size * 0.78, size * 0.22);
    ctx.fillStyle = '#6D28D9';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x + size * 0.5, y + size * 0.24, size * 0.22, Math.PI, 0, false);
    ctx.lineWidth = Math.max(4, size * 0.08);
    ctx.strokeStyle = '#6D28D9';
    ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = `900 ${Math.round(size * 0.44)}px "Plus Jakarta Sans", -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', x + size * 0.5, y + size * 0.64);
    ctx.restore();
  }

  function drawBestSellerBadge(ctx, cx, cy) {
    ctx.save();

    ctx.fillStyle = '#4C1D95';
    ctx.beginPath();
    ctx.moveTo(cx - 56, cy + 45);
    ctx.lineTo(cx - 12, cy + 45);
    ctx.lineTo(cx - 24, cy + 128);
    ctx.lineTo(cx - 46, cy + 106);
    ctx.lineTo(cx - 68, cy + 128);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx + 12, cy + 45);
    ctx.lineTo(cx + 56, cy + 45);
    ctx.lineTo(cx + 68, cy + 128);
    ctx.lineTo(cx + 46, cy + 106);
    ctx.lineTo(cx + 24, cy + 128);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 82, 0, Math.PI * 2);
    ctx.fillStyle = '#FACC15';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 73, 0, Math.PI * 2);
    ctx.fillStyle = '#5B21B6';
    ctx.fill();

    ctx.fillStyle = '#FACC15';
    ctx.beginPath();
    ctx.moveTo(cx - 26, cy - 26);
    ctx.lineTo(cx - 32, cy - 48);
    ctx.lineTo(cx - 12, cy - 36);
    ctx.lineTo(cx, cy - 54);
    ctx.lineTo(cx + 12, cy - 36);
    ctx.lineTo(cx + 32, cy - 48);
    ctx.lineTo(cx + 26, cy - 26);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 22px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BEST', cx, cy + 2);
    ctx.fillText('SELLER', cx, cy + 24);

    ctx.fillStyle = '#FACC15';
    ctx.font = '900 17px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('★★★★★', cx, cy + 47);

    ctx.restore();
  }

  function drawFeaturePill(ctx, x, y, w, h, titleText, iconType) {
    ctx.save();
    ctx.shadowColor = 'rgba(76, 29, 149, 0.14)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 6;
    drawRoundedRect(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#EDE9FE';
    ctx.stroke();

    const icx = x + 36;
    const icy = y + h / 2;
    ctx.beginPath();
    ctx.arc(icx, icy, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#EDE9FE';
    ctx.fill();

    ctx.fillStyle = '#6D28D9';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 18px "Plus Jakarta Sans", -apple-system, sans-serif';
    const symbolMap = { gem: '◆', sofa: '🛋', shield: '✓', home: '⌂' };
    ctx.fillText(symbolMap[iconType] || '★', icx, icy + 1);

    ctx.fillStyle = '#1E1B4B';
    ctx.textAlign = 'left';
    ctx.font = '800 19px "Plus Jakarta Sans", -apple-system, sans-serif';
    const parts = titleText.split('\n');
    if (parts.length > 1) {
      ctx.fillText(parts[0], x + 66, y + h * 0.36);
      ctx.fillText(parts[1], x + 66, y + h * 0.68);
    } else {
      ctx.fillText(parts[0], x + 66, y + h * 0.52);
    }
    ctx.restore();
  }

  function loadImageSafe(src, useCors) {
    return new Promise((resolve) => {
      if (!src) return resolve(null);
      const img = new Image();
      if (useCors) img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function paintFlyerCanvas(data, loadedImg, loadedLogo) {
    const { title, price, location } = data;
    const modal = document.getElementById('nsFlyerModal');
    const canvas = document.getElementById('nsFlyerCanvas');
    const previewImg = document.getElementById('nsFlyerPreviewImg');
    const ctx = canvas.getContext('2d');

    const W = 1080;
    const H = 1350;

    // 1. Clean white base with soft purple top accents
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);

    const topWash = ctx.createLinearGradient(0, 0, W, 240);
    topWash.addColorStop(0, '#F3E8FF');
    topWash.addColorStop(0.6, '#FAF5FF');
    topWash.addColorStop(1, '#EDE9FE');
    ctx.fillStyle = topWash;
    ctx.fillRect(0, 0, W, 165);

    ctx.save();
    ctx.fillStyle = '#6D28D9';
    ctx.beginPath();
    ctx.moveTo(760, 0);
    ctx.quadraticCurveTo(950, 10, 1080, 130);
    ctx.lineTo(1080, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 2. Real NaijaSale Logo + Brand Header + Trusted Badge
    const logoBoxX = 42;
    const logoBoxY = 30;
    const logoBoxW = 74;
    const logoBoxH = 74;

    if (loadedLogo && loadedLogo.width > 0) {
      ctx.save();
      drawRoundedRect(ctx, logoBoxX, logoBoxY, logoBoxW, logoBoxH, 16);
      ctx.clip();
      const lScale = Math.min(logoBoxW / loadedLogo.width, logoBoxH / loadedLogo.height);
      const lw = loadedLogo.width * lScale;
      const lh = loadedLogo.height * lScale;
      ctx.drawImage(
        loadedLogo,
        logoBoxX + (logoBoxW - lw) / 2,
        logoBoxY + (logoBoxH - lh) / 2,
        lw,
        lh
      );
      ctx.restore();
    } else {
      drawFallbackBagIcon(ctx, logoBoxX, logoBoxY, 68);
    }

    ctx.fillStyle = '#5B21B6';
    ctx.font = '900 44px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('NaijaSale.com', 128, 78);

    ctx.fillStyle = '#64748B';
    ctx.font = '700 21px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('Buy • Sell • Shop Smarter', 130, 109);

    drawRoundedRect(ctx, 710, 42, 324, 66, 33);
    ctx.fillStyle = '#F5F3FF';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#DDD6FE';
    ctx.stroke();

    ctx.fillStyle = '#7C3AED';
    ctx.font = '900 22px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('✓', 732, 83);

    ctx.fillStyle = '#1E1B4B';
    ctx.font = '800 18px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('Trusted Marketplace', 764, 70);
    ctx.fillStyle = '#6D28D9';
    ctx.font = '700 17px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('in Nigeria', 764, 93);

    // 3. Soft Showcase Backdrop
    const stageX = 48;
    const stageY = 152;
    const stageW = 984;
    const stageH = 665;

    ctx.save();
    drawRoundedRect(ctx, stageX, stageY, stageW, stageH, 36);
    ctx.clip();

    const stageGrad = ctx.createLinearGradient(stageX, stageY, stageX, stageY + stageH);
    stageGrad.addColorStop(0, '#F5F3FF');
    stageGrad.addColorStop(1, '#F8FAFC');
    ctx.fillStyle = stageGrad;
    ctx.fillRect(stageX, stageY, stageW, stageH);

    // Expanded Photo Box matching your green outline (reaching down to the price badge)
    const picX = 205;
    const picY = 158;
    const picW = 562;
    const picH = 592;

    if (loadedImg && loadedImg.width > 0) {
      ctx.save();
      drawRoundedRect(ctx, picX, picY, picW, picH, 28);
      ctx.clip();

      if (flyerFramingMode === 'smart') {
        const scale = Math.max(picW / loadedImg.width, picH / loadedImg.height);
        const dw = loadedImg.width * scale;
        const dh = loadedImg.height * scale;
        ctx.drawImage(
          loadedImg,
          picX + (picW - dw) / 2,
          picY + (picH - dh) / 2,
          dw,
          dh
        );
      } else {
        const fitScale = Math.min(picW / loadedImg.width, picH / loadedImg.height);
        const dw = loadedImg.width * fitScale;
        const dh = loadedImg.height * fitScale;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(picX, picY, picW, picH);
        ctx.drawImage(
          loadedImg,
          picX + (picW - dw) / 2,
          picY + (picH - dh) / 2,
          dw,
          dh
        );
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#EDE9FE';
      drawRoundedRect(ctx, picX, picY, picW, picH, 28);
      ctx.fill();
      ctx.fillStyle = '#5B21B6';
      ctx.font = '900 38px "Plus Jakarta Sans", -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NaijaSale Verified Ad', picX + picW / 2, picY + picH / 2);
    }

    const fadeGrad = ctx.createLinearGradient(0, stageY + stageH - 140, 0, stageY + stageH + 20);
    fadeGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    fadeGrad.addColorStop(1, 'rgba(255, 255, 255, 0.96)');
    ctx.fillStyle = fadeGrad;
    ctx.fillRect(stageX, stageY + stageH - 140, stageW, 160);
    ctx.restore();

    // 4. Floating "BEST SELLER" Medallion
    drawBestSellerBadge(ctx, 132, 232);

    // 5. Floating Feature Pills Stack
    const pillX = 774;
    const pillW = 242;
    const pillH = 68;
    drawFeaturePill(ctx, pillX, 188, pillW, pillH, 'Premium\nQuality', 'gem');
    drawFeaturePill(ctx, pillX, 272, pillW, pillH, 'Stylish\nDesign', 'sofa');
    drawFeaturePill(ctx, pillX, 356, pillW, pillH, 'Durable &\nLong-Lasting', 'shield');
    drawFeaturePill(ctx, pillX, 440, pillW, pillH, 'Perfect for\nYour Home', 'home');

    // 6. Circular Detail Inset + "Elegant Finish" Tag
    const circX = 892;
    const circY = 695;
    const circR = 96;

    ctx.save();
    ctx.shadowColor = 'rgba(15, 23, 42, 0.22)';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(circX, circY, circR + 7, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.beginPath();
    ctx.arc(circX, circY, circR, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#F1F5F9';
    ctx.fillRect(circX - circR, circY - circR, circR * 2, circR * 2);

    if (loadedImg && loadedImg.width > 0) {
      const cropSize = Math.min(loadedImg.width, loadedImg.height) * 0.45;
      const sx = Math.max(0, (loadedImg.width - cropSize) * 0.65);
      const sy = Math.max(0, (loadedImg.height - cropSize) * 0.55);
      ctx.drawImage(loadedImg, sx, sy, cropSize, cropSize, circX - circR, circY - circR, circR * 2, circR * 2);
    }
    ctx.restore();

    drawRoundedRect(ctx, circX - 88, circY + 56, 176, 44, 22);
    const finishGrad = ctx.createLinearGradient(circX - 88, 0, circX + 88, 0);
    finishGrad.addColorStop(0, '#FACC15');
    finishGrad.addColorStop(0.2, '#6D28D9');
    finishGrad.addColorStop(1, '#5B21B6');
    ctx.fillStyle = finishGrad;
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 18px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Elegant Finish', circX, circY + 84);

    // 7. Bold Purple & Gold Price Ribbon
    const ribbonX = 48;
    const ribbonY = 742;
    const ribbonW = 635;
    const ribbonH = 104;

    drawRoundedRect(ctx, ribbonX + 26, ribbonY + ribbonH - 8, ribbonW - 52, 22, 11);
    ctx.fillStyle = '#FACC15';
    ctx.fill();

    drawRoundedRect(ctx, ribbonX, ribbonY, ribbonW, ribbonH, 52);
    const priceGrad = ctx.createLinearGradient(ribbonX, ribbonY, ribbonX + ribbonW, ribbonY + ribbonH);
    priceGrad.addColorStop(0, '#7C3AED');
    priceGrad.addColorStop(0.55, '#5B21B6');
    priceGrad.addColorStop(1, '#4C1D95');
    ctx.fillStyle = priceGrad;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#EDE9FE';
    ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'left';
    ctx.font = '900 54px "Plus Jakarta Sans", -apple-system, sans-serif';
    const displayPrice = price ? (price.startsWith('₦') ? price : '₦' + price) : 'Contact for Price';
    ctx.fillText(displayPrice, ribbonX + 46, ribbonY + 71);

    // 8. Item Title
    const titleX = 52;
    const titleY = 918;
    ctx.font = '900 50px "Plus Jakarta Sans", -apple-system, sans-serif';
    const titleLines = wrapLines(ctx, title, 970, 2);

    ctx.fillStyle = '#0F172A';
    ctx.fillText(titleLines[0] || '', titleX, titleY);

    if (titleLines[1]) {
      ctx.fillStyle = '#6D28D9';
      ctx.fillText(titleLines[1], titleX, titleY + 58);
    }

    // 9. Trust Strip
    const trustY = 1056;
    ctx.textAlign = 'left';
    ctx.font = '800 22px "Plus Jakarta Sans", -apple-system, sans-serif';

    ctx.fillStyle = '#6D28D9';
    ctx.fillText('☺', 52, trustY);
    ctx.fillStyle = '#1E1B4B';
    ctx.fillText('Comfort', 84, trustY - 10);
    ctx.fillText('Guaranteed', 84, trustY + 13);

    ctx.fillStyle = '#DDD6FE';
    ctx.fillRect(245, trustY - 26, 2, 48);

    ctx.fillStyle = '#6D28D9';
    ctx.fillText('👍', 268, trustY);
    ctx.fillStyle = '#1E1B4B';
    ctx.fillText('Great', 302, trustY - 10);
    ctx.fillText('Value', 302, trustY + 13);

    ctx.fillStyle = '#DDD6FE';
    ctx.fillRect(408, trustY - 26, 2, 48);

    ctx.fillStyle = '#6D28D9';
    ctx.fillText('🚚', 432, trustY);
    ctx.fillStyle = '#1E1B4B';
    ctx.fillText('Nationwide', 468, trustY - 10);
    ctx.fillText('Delivery', 468, trustY + 13);

    // 10. Location Pin Line
    const locY = 1134;
    ctx.fillStyle = '#6D28D9';
    ctx.font = '900 28px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('📍', 50, locY);

    ctx.fillStyle = '#1E1B4B';
    ctx.font = '800 27px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText(location, 92, locY);

    // 11. Bottom Purple Wave Banner + Yellow "Buy Now >" CTA Pill
    ctx.save();
    const footGrad = ctx.createLinearGradient(0, 1165, W, H);
    footGrad.addColorStop(0, '#5B21B6');
    footGrad.addColorStop(0.55, '#6D28D9');
    footGrad.addColorStop(1, '#4C1D95');
    ctx.fillStyle = footGrad;

    ctx.beginPath();
    ctx.moveTo(0, 1205);
    ctx.quadraticCurveTo(280, 1155, 620, 1185);
    ctx.quadraticCurveTo(880, 1205, W, 1168);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(92, 1272, 42, 0, Math.PI * 2);
    ctx.fillStyle = '#7C3AED';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#DDD6FE';
    ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 32px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔍', 92, 1283);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 32px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('Search on NaijaSale.com', 152, 1264);

    ctx.fillStyle = '#FDE68A';
    ctx.font = '700 23px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('— or DM me to buy now! —', 165, 1296);

    const ctaX = 720;
    const ctaY = 1226;
    const ctaW = 316;
    const ctaH = 88;

    ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;
    drawRoundedRect(ctx, ctaX, ctaY, ctaW, ctaH, 44);
    const ctaGrad = ctx.createLinearGradient(ctaX, ctaY, ctaX, ctaY + ctaH);
    ctaGrad.addColorStop(0, '#FDE047');
    ctaGrad.addColorStop(1, '#F59E0B');
    ctx.fillStyle = ctaGrad;
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#0F172A';
    ctx.font = '900 34px "Plus Jakarta Sans", -apple-system, sans-serif';
    ctx.fillText('🛒 Buy Now >', ctaX + 36, ctaY + 56);
    ctx.restore();

    canvas.toBlob((blob) => {
      currentFlyerBlob = blob;
      if (blob) {
        previewImg.src = URL.createObjectURL(blob);
      } else {
        previewImg.src = canvas.toDataURL('image/png');
      }
      modal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }, 'image/png');
  }

  async function openWhatsAppFlyer(btn) {
    const title = btn.dataset.title || 'Quality Item For Sale';
    const price = btn.dataset.price || '';
    const location = btn.dataset.location || 'Nigeria';
    const imgUrl = btn.dataset.img || '';
    const logoUrl = btn.dataset.logo || '';
    const adUrl = btn.dataset.url || window.location.origin;

    currentFlyerTitle = title;
    currentFlyerFilename = `NaijaSale-${title.slice(0, 20).replace(/[^a-zA-Z0-9]/g, '-')}.png`;
    currentFlyerData = { title, price, location };
    flyerFramingMode = 'smart';
    updateFramingButtonLabel();

    const shareWaBtn = document.getElementById('nsShareWaBtn');
    const waText = encodeURIComponent(`🔥 ${title} — ₦${price}\n📍 ${location}\n\nView full photos & chat with me on NaijaSale:\n${adUrl}`);
    shareWaBtn.href = `https://wa.me/?text=${waText}`;

    const [loadedImg, loadedLogo] = await Promise.all([
      loadImageSafe(imgUrl, false),
      loadImageSafe(logoUrl, true)
    ]);

    currentLoadedImg = loadedImg;
    currentLoadedLogo = loadedLogo;
    paintFlyerCanvas(currentFlyerData, loadedImg, loadedLogo);
  }
</script>
