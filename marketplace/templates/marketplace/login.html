{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Naijasale</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="min-h-screen bg-white flex flex-col justify-between px-6 py-6 sm:py-12">

  <div class="w-full max-w-sm mx-auto">
    
    <!-- Top Back Arrow -->
    <div class="mb-10">
      <a href="{% url 'marketplace:home' %}" class="inline-flex text-slate-800 hover:text-slate-900 transition-colors">
        <i data-lucide="arrow-left" class="w-6 h-6 stroke-[2.2]"></i>
      </a>
    </div>

    <!-- Centered Header -->
    <h1 class="text-2xl sm:text-3xl font-extrabold text-[#1B3593] text-center mb-8 tracking-tight">
      Login
    </h1>

    <!-- Error Alert -->
    {% if error_message %}
      <div class="p-3 mb-4 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">
        {{ error_message }}
      </div>
    {% endif %}

    <!-- Form -->
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Email / Username -->
      <div>
        <input 
          type="text" 
          name="identifier" 
          required 
          placeholder="Email or Username" 
          class="w-full bg-[#F3F4FB] text-slate-800 placeholder-slate-400 px-4 py-3.5 rounded-lg text-sm border border-transparent focus:border-[#2250EB] focus:bg-white focus:outline-none transition-all"
        >
      </div>

      <!-- Password with Eye Toggle -->
      <div class="relative">
        <input 
          type="password" 
          id="loginPassword" 
          name="password" 
          required 
          placeholder="Password" 
          class="w-full bg-[#F3F4FB] text-slate-800 placeholder-slate-400 px-4 py-3.5 rounded-lg text-sm border border-transparent focus:border-[#2250EB] focus:bg-white focus:outline-none transition-all pr-11"
        >
        <button type="button" onclick="toggleLoginPassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 focus:outline-none">
          <i id="loginEyeIcon" data-lucide="eye" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Forgot Password Link -->
      <div class="flex justify-end pt-1">
        <a href="{% url 'marketplace:password_reset' %}" class="text-xs font-semibold text-[#2952E3] hover:underline">
          Forgot Password?
        </a>
      </div>

      <!-- Login Action Button -->
      <div class="pt-4">
        <button type="submit" class="w-full bg-[#2952E3] hover:bg-[#1E40C7] text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md active:scale-98">
          Login
        </button>
      </div>

    </form>

    <!-- OR Divider + Google OAuth Login -->
    <div class="relative flex items-center justify-center my-6">
      <div class="border-t border-slate-200 w-full"></div>
      <span class="bg-white px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">or</span>
      <div class="border-t border-slate-200 w-full"></div>
    </div>

    <a href="{% provider_login_url 'google' %}" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-800 font-bold py-3.5 px-4 rounded-lg text-sm border border-slate-300 shadow-2xs transition-all active:scale-98">
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
        <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
      </svg>
      <span>Continue with Google</span>
    </a>

    <!-- Bottom Switch Link -->
    <p class="text-center text-xs font-semibold text-slate-800 mt-10">
      Don't have an account? 
      <a href="{% url 'marketplace:register' %}" class="text-[#2952E3] font-bold hover:underline">
        Sign up
      </a>
    </p>

  </div>

  <script>
    function toggleLoginPassword() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('loginEyeIcon');

      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    lucide.createIcons();
  </script>
</body>
</html>
