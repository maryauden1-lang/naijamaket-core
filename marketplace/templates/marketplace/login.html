<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Naijasale</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="min-h-screen bg-white flex flex-col justify-between px-6 py-6 sm:py-12">

  <div class="w-full max-w-sm mx-auto">
    
    <!-- Top Back Arrow -->
    <div class="mb-10">
      <a href="{% url 'marketplace:home' %}" class="inline-flex text-slate-800 hover:text-slate-900 transition-colors">
        <i data-lucide="arrow-left" class="w-6 h-6 stroke-[2.2]"></i>
      </a>
    </div>

    <!-- Centered Header -->
    <h1 class="text-2xl sm:text-3xl font-extrabold text-[#1B3593] text-center mb-8 tracking-tight">
      Login
    </h1>

    <!-- Error Alert -->
    {% if error_message %}
      <div class="p-3 mb-4 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">
        {{ error_message }}
      </div>
    {% endif %}

    <!-- Form -->
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Email / Username -->
      <div>
        <input 
          type="text" 
          name="identifier" 
          required 
          placeholder="Email or Username" 
          class="w-full bg-[#F3F4FB] text-slate-800 placeholder-slate-400 px-4 py-3.5 rounded-lg text-sm border border-transparent focus:border-[#2250EB] focus:bg-white focus:outline-none transition-all"
        >
      </div>

      <!-- Password with Eye Toggle -->
      <div class="relative">
        <input 
          type="password" 
          id="loginPassword" 
          name="password" 
          required 
          placeholder="Password" 
          class="w-full bg-[#F3F4FB] text-slate-800 placeholder-slate-400 px-4 py-3.5 rounded-lg text-sm border border-transparent focus:border-[#2250EB] focus:bg-white focus:outline-none transition-all pr-11"
        >
        <button type="button" onclick="toggleLoginPassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 focus:outline-none">
          <i id="loginEyeIcon" data-lucide="eye" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Forgot Password Link -->
      <div class="flex justify-end pt-1">
        <a href="{% url 'marketplace:password_reset' %}" class="text-xs font-semibold text-[#2952E3] hover:underline">
          Forgot Password?
        </a>
      </div>

      <!-- Login Action Button -->
      <div class="pt-4">
        <button type="submit" class="w-full bg-[#2952E3] hover:bg-[#1E40C7] text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md active:scale-98">
          Login
        </button>
      </div>

    </form>

    <!-- Bottom Switch Link -->
    <p class="text-center text-xs font-semibold text-slate-800 mt-10">
      Don't have an account? 
      <a href="{% url 'marketplace:register' %}" class="text-[#2952E3] font-bold hover:underline">
        Sign up
      </a>
    </p>

  </div>

  <script>
    function toggleLoginPassword() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('loginEyeIcon');

      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    lucide.createIcons();
  </script>
</body>
</html>
