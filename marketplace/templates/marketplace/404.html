<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Naijasale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 40px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        h1 {
            font-size: 72px;
            margin: 0;
            color: #059669;
            font-weight: 800;
            line-height: 1;
        }
        h2 {
            font-size: 22px;
            margin: 16px 0 10px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            background-color: #059669;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
        }
        .btn:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The ad, listing, or page you are looking for may have been removed, sold, or the web address was typed incorrectly.</p>
        <a href="/" class="btn">Back to Naijasale</a>
    </div>
</body>
</html>
