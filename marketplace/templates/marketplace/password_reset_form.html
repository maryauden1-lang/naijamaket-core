<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Naijasale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; }</style>
</head>
<body class="min-h-screen bg-white flex flex-col justify-between px-6 py-6 sm:py-12">
  <div class="w-full max-w-sm mx-auto">
    <div class="mb-8">
      <a href="{% url 'marketplace:login' %}" class="inline-flex text-slate-800 hover:text-slate-900 transition-colors">
        <i data-lucide="arrow-left" class="w-6 h-6 stroke-[2.2]"></i>
      </a>
    </div>

    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-blue-50 text-[#2952E3] rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i data-lucide="key-round" class="w-7 h-7"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-[#1B3593] tracking-tight">Forgot password?</h1>
      <p class="text-xs text-slate-500 mt-2">No worries, enter your account email and we will send you a reset link.</p>
    </div>

    {% if form.errors %}
      <div class="p-3 mb-4 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">
        Please enter a valid email address.
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <input 
          type="email" 
          name="email" 
          required 
          placeholder="Enter your registered email" 
          class="w-full bg-[#F3F4FB] text-slate-800 placeholder-slate-400 px-4 py-3.5 rounded-lg text-sm border border-transparent focus:border-[#2250EB] focus:bg-white focus:outline-none transition-all"
        >
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-[#2952E3] hover:bg-[#1E40C7] text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md active:scale-98">
          Send Reset Link
        </button>
      </div>
    </form>

    <p class="text-center text-xs font-semibold text-slate-800 mt-10">
      Remember password? 
      <a href="{% url 'marketplace:login' %}" class="text-[#2952E3] font-bold hover:underline">
        Back to Login
      </a>
    </p>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
