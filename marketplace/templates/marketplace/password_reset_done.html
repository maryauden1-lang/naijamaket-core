<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Email Sent - Naijasale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; }</style>
</head>
<body class="min-h-screen bg-white flex flex-col justify-center px-6 py-12">
  <div class="w-full max-w-sm mx-auto text-center">
    <div class="w-16 h-16 bg-blue-50 text-[#2952E3] rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm">
      <i data-lucide="mail-check" class="w-8 h-8"></i>
    </div>
    
    <h1 class="text-2xl font-extrabold text-[#1B3593] tracking-tight">Check your email</h1>
    <p class="text-xs text-slate-600 mt-3 leading-relaxed">
      We sent a password reset link to your email address. Please open the link to set your new password.
    </p>

    <div class="pt-8">
      <a href="{% url 'marketplace:login' %}" class="inline-block w-full bg-[#2952E3] hover:bg-[#1E40C7] text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md">
        Back to Login
      </a>
    </div>

    <p class="text-[11px] text-slate-400 mt-6">
      Did not receive the email? Check your spam folder or make sure you entered the correct registered address.
    </p>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
