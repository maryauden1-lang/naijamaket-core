<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify Email - Naijasale</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-white flex flex-col justify-center px-6 py-12"><div class="w-full max-w-sm mx-auto"><div class="text-center mb-8"><h1 class="text-2xl font-extrabold text-[#1B3593]">Verify Your Email</h1><p class="text-xs text-slate-500 mt-2">We sent a 6-digit code to <span class="font-bold text-slate-700">{{ email }}</span></p></div>{% if error %}<div class="p-3 mb-4 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">{{ error }}</div>{% endif %}<form method="POST" class="space-y-4">{% csrf_token %}<div><input type="text" name="otp_code" maxlength="6" required autofocus placeholder="• • • • • •" class="w-full bg-[#F3F4FB] text-slate-800 text-center tracking-[0.5em] text-2xl font-bold px-4 py-3.5 rounded-lg border border-transparent focus:border-[#2250EB] focus:bg-white focus:outline-none"></div><div class="pt-2"><button type="submit" class="w-full bg-[#2952E3] hover:bg-[#1E40C7] text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md">Confirm & Activate Account</button></div></form><p class="text-center text-xs text-slate-500 mt-8">Didn't get a code? <a href="{% url 'marketplace:resend_otp' %}" class="text-[#2952E3] font-bold hover:underline">Resend Code</a></p></div><script>lucide.createIcons();</script></body></html>
